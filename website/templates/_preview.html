{# Server-rendered first rows of the list, for crawlers and AI agents that don't run JavaScript.
   Expects preview_rows (from preview_list()), preview_title and preview_api (full list URL). #}
{% if preview_rows %}
<noscript>
    <section class="mt-8 rounded-xl border bg-white p-6">
        <h2 class="text-lg font-semibold text-gray-900">{{ preview_title }}</h2>
        <p class="mt-1 text-sm text-gray-500">
            The first {{ preview_rows | length }} entries. Full list:
            <a href="{{ preview_api }}">{{ site_url }}{{ preview_api }}</a>
        </p>
        <ul class="mt-3 font-mono text-sm">
            {% for row in preview_rows %}
            <li>{{ row[0] | to_unicode }}{% if row | length >= 3 %}: {{ row[1] | provider_name }} → {{ row[2] | provider_name }}{% endif %}</li>
            {% endfor %}
        </ul>
    </section>
</noscript>
{% endif %}
