<div
    id="download-section"
    class="relative p-8 pt-10 border border-gray-200 rounded-lg shadow-sm bg-white text-center max-w-xl mx-auto mb-10"
    x-cloak
    x-show="$store.download.payload !== null"
    x-transition
>

    <div class="absolute left-0 right-0 flex items-center justify-center -top-5">
        <div class="flex items-center justify-center w-12 h-12 p-2.5 bg-white border border-gray-200 rounded-full">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-download text-sky-600" viewBox="0 0 16 16">
                <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"></path>
                <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"></path>
            </svg>
        </div>
    </div>

    <h2 class="text-xl font-semibold text-gray-900" x-text="$store.download.heading"></h2>

    <div class="mt-6">

        <template x-if="$store.download.step === 'idle'">
            <button
                @click="$store.download.verify()"
                class="w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-100"
            >
                ✓ I'm not a robot — Continue to download
            </button>
        </template>

        <template x-if="$store.download.step === 'verifying'">
            <div class="rounded-lg border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-500">
                Verifying...
            </div>
        </template>

        <template x-if="$store.download.step === 'counting'">
            <div class="rounded-lg border border-sky-200 bg-sky-50 px-4 py-3 text-sm text-sky-700">
                Your download will start in <span class="font-semibold" x-text="$store.download.count"></span>s...
            </div>
        </template>

        <template x-if="$store.download.step === 'ready'">
            <div class="space-y-2">
                <div class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700">
                    Your download has started.
                </div>
                <a
                    :href="$store.download.downloadUrl"
                    class="inline-block text-sm text-sky-600 hover:text-sky-800"
                >
                    Didn't start? Click here.
                </a>
            </div>
        </template>

        <template x-if="$store.download.step === 'error'">
            <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" x-text="$store.download.error"></div>
        </template>

    </div>

    <p class="mt-6 text-xs text-gray-400">
        This link is single-use and expires once used.
    </p>

</div>
